name: Build AirCons

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aircons-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AIRCONS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::AIRCONS_KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aircons-release.jks"

      - name: Build release APK
        env:
          AIRCONS_STORE_FILE: ${{ runner.temp }}/aircons-release.jks
          AIRCONS_STORE_PASSWORD: ${{ secrets.AIRCONS_STORE_PASSWORD }}
          AIRCONS_KEY_ALIAS: ${{ secrets.AIRCONS_KEY_ALIAS }}
          AIRCONS_KEY_PASSWORD: ${{ secrets.AIRCONS_KEY_PASSWORD }}
        run: |
          EPOCH=$(date +%s)
          ./gradlew --no-daemon assembleRelease \
            -PairconsVersionCode=${GITHUB_RUN_NUMBER} \
            -PairconsVersionName=1.0.${GITHUB_RUN_NUMBER} \
            -PairconsBuildEpoch=${EPOCH}

      - name: Stage APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/AirCons-${GITHUB_RUN_NUMBER}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirCons-APK
          path: out/*.apk
          if-no-files-found: error

      - name: Prune old release APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release view latest --json assets --jq '.assets[].name' |
              while read -r name; do
                case "$name" in
                  *.apk) gh release delete-asset latest "$name" --yes ;;
                esac
              done
          fi

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AirCons 1.0.${{ github.run_number }}
          body: |
            Automated build of `${{ github.sha }}`.

            Version `1.0.${{ github.run_number }}` · built from the `main` branch.
            Download the APK below, or update from inside the app.
          files: out/*.apk
          make_latest: true
